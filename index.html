<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>RPG 2D</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100vw;
        height: 100vh;

        overflow: hidden;

        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #game-container {
        position: fixed;

        left: 0;
        top: 0;

        width: 100vw;
        height: 100vh;

        margin: 0;
        padding: 0;

        overflow: hidden;
      }

      #game-container canvas {
        display: block;

        position: absolute;

        left: 0;
        top: 0;

        width: 100vw !important;
        height: 100vh !important;
      }
    </style>
  </head>

  <body>
    <div id="game-container"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
